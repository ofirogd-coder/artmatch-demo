<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>ArtMatch דמו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap">
<style>
:root{
  --n50:#FCFAF7;--n100:#F5F3F1;--n200:#EAE5E1;--n300:#D8D3CF;--n500:#A29E99;--n600:#7E7974;--n700:#5F5A55;--n800:#433F3A;--n900:#2A2621;--n950:#17130F;
  --b100:#FEEAE0;--b200:#F8D6C5;--b500:#CD7A4D;--b700:#964C20;--b800:#773913;--b900:#552609;
  --m100:#E0F6F2;--m500:#2BC2AC;--m700:#167A6C;--m800:#0F5A50;
  --ok:#317A45;--err:#B3363D;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--n200);color:var(--n900);font-family:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--n50);border:2px solid var(--m500);overflow:hidden;display:flex;flex-direction:column}
#app{border-radius:44px}
@media (max-width:479px){body{background:var(--n50)}#app{height:calc(100% - 8px);margin:4px;border-radius:24px}}
@media (min-width:480px){#app{height:calc(100% - 24px);margin-top:12px;border-radius:36px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:12px 20px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;position:relative}
.top .logo{position:absolute;left:50%;transform:translateX(-50%)}
.top .logo{width:92px}
.iconbtn{width:44px;height:44px;border-radius:999px;border:none;background:var(--n100);display:flex;align-items:center;justify-content:center;color:var(--n900);flex-shrink:0;position:relative}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-2px;left:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--b700);color:var(--n50);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
.badge.m{background:var(--m700)}
h1{font-weight:400;font-size:28px;line-height:1.25;margin:0;color:var(--n950);text-wrap:balance}
h2{font-weight:500;font-size:19px;margin:0;color:var(--n950)}
.sub{color:var(--n700);font-size:15px;line-height:1.55;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}
.grow{flex:1}
.btn{min-height:54px;border-radius:999px;border:none;background:var(--b700);color:var(--n50);font-weight:500;font-size:17px;padding:0 24px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn:active{background:var(--b800)}
.btn[disabled]{background:var(--n300);color:var(--n700)}
.btn.ghost{background:transparent;border:1.5px solid var(--n600);color:var(--n900)}
.btn.soft{background:var(--n100);color:var(--n900)}
.btn.match{background:var(--m700)}
.link{background:none;border:none;color:var(--b800);font-weight:500;font-size:15px;min-height:44px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--n300);background:var(--n50);color:var(--n800);font-size:15px}
.chip[aria-pressed="true"]{background:var(--b200);border-color:var(--b200);color:var(--b900);font-weight:500}
.card{border:1.5px solid var(--n200);border-radius:22px;padding:16px;background:var(--n50);text-align:right;width:100%}
.card[aria-pressed="true"]{border-color:var(--b700);background:var(--b100)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--n700)}
.input{height:52px;border-radius:14px;border:1.5px solid var(--n600);background:var(--n50);padding:0 14px;font-size:17px;width:100%}
.input:focus,.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--m700);outline-offset:2px}
.note{font-size:13px;color:var(--n700);line-height:1.5;text-align:center}
.demo-tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--n100);color:var(--n700);font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* wall */
.wallfit{display:flex;align-items:center;justify-content:center;background:var(--n100);border-radius:20px;overflow:hidden}
.scard .wallfit{border-radius:0}
.wall{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:linear-gradient(#EFE9E2,#E6DED5);}
.wall img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wall .floor{position:absolute;left:0;right:0;bottom:0;height:12%;background:#CDBFAF}
.wall .art{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);box-shadow:0 6px 18px rgba(23,19,15,.35);outline:3px solid #FCFAF7;background:#fff}
.wall .art svg{display:block;width:100%;height:100%}
.wall .dims{z-index:3;position:absolute;bottom:8px;right:8px;background:rgba(23,19,15,.72);color:#FCFAF7;font-size:12px;padding:4px 10px;border-radius:999px}
.cedit{overflow:visible!important;border-radius:0!important}
.cmark{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:auto;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;z-index:2}
.cmark::before{content:"";width:26px;height:26px;border-radius:999px;border:3px solid var(--b700);background:rgba(252,250,247,.7);box-shadow:0 2px 6px rgba(23,19,15,.4)}
.cmark::after{content:"";position:absolute;width:6px;height:6px;border-radius:999px;background:var(--b700)}
.wall,.wall *,.handle,.cmark,.scard{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.wall img{pointer-events:none;-webkit-user-drag:none}
.loupe{position:absolute;width:116px;height:116px;border-radius:999px;border:3px solid var(--m500);box-shadow:0 6px 18px rgba(23,19,15,.45);background-repeat:no-repeat;background-color:#000;pointer-events:none;z-index:5}
.loupe::before,.loupe::after{content:"";position:absolute;background:var(--m500)}
.loupe::before{left:57px;top:40px;width:2px;height:36px}
.loupe::after{top:57px;left:40px;height:2px;width:36px}
.handle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:999px;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:2;cursor:grab}
.handle::after{content:"";width:11px;height:11px;border-radius:999px;background:var(--m500);border:2px solid #FCFAF7;box-shadow:0 2px 6px rgba(23,19,15,.45)}
.cpoly{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.gl{position:absolute;pointer-events:none;border:0 dashed rgba(23,19,15,.6)}
.gl.h{left:0;right:0;border-top-width:1.5px}
.gl.v{bottom:0;border-left-width:1.5px}
.gl,.wallfit .hchip{opacity:0;transition:opacity .15s}
.showgl .gl,.showgl .hchip,.dragging .gl,.dragging .hchip{opacity:1}
.art.drag{pointer-events:auto;touch-action:none;cursor:grab}
.wtools{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.wtools .iconbtn{background:rgba(252,250,247,.95);box-shadow:0 2px 8px rgba(23,19,15,.2)}
.hchip{position:absolute;top:10px;right:10px;background:rgba(252,250,247,.95);color:var(--n900);font-size:13px;padding:6px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(23,19,15,.15);z-index:3}
.art{position:absolute}
.tint{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.35;pointer-events:none}
.artonly{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;background:var(--n100)}
.artonly .dims{position:absolute;bottom:8px;right:8px;background:rgba(23,19,15,.72);color:#FCFAF7;font-size:12px;padding:4px 10px;border-radius:999px}
.aframe{box-shadow:0 8px 24px rgba(23,19,15,.25);outline:6px solid #FCFAF7;background:#fff}
.aframe svg,.aframe img{display:block;width:100%;height:100%}
.ver{position:absolute;left:16px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10px;color:var(--n500);opacity:.8;pointer-events:none;z-index:70;letter-spacing:.02em}
.occ{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;object-fit:fill}
.detbar{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:16px calc(-1*max(18px,env(safe-area-inset-left,0px))) -20px;padding:12px 24px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(252,250,247,.96);border-top:1px solid var(--n200);display:flex;justify-content:space-between;align-items:center;z-index:20;backdrop-filter:blur(6px)}
.more{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;border:none;border-radius:999px;background:var(--n950);color:var(--n50);font-size:13px;padding:8px 16px;box-shadow:0 4px 14px rgba(23,19,15,.3);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.plane{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;pointer-events:none}
.ph-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upl{position:relative;min-height:52px;border-radius:16px;border:1.5px solid var(--n600);background:var(--n50);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:15px}
.upl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* swipe */
.deck{position:relative;flex:1;min-height:360px;margin-top:6px}
.scard{position:absolute;left:0;right:0;top:0;border-radius:26px;background:var(--n50);border:1.5px solid var(--n200);box-shadow:0 10px 30px rgba(23,19,15,.12);display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.scard.back{transform:scale(.95) translateY(10px);opacity:.7}
.scard .wall{border-radius:0}
.scard .meta{padding:12px 16px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.stamp{position:absolute;top:22px;padding:6px 14px;border-radius:12px;font-weight:700;font-size:20px;border:3px solid;opacity:0;background:rgba(252,250,247,.9);z-index:3}
.stamp.like{left:18px;color:var(--m700);border-color:var(--m700);transform:rotate(-12deg)}
.stamp.nope{right:18px;color:var(--err);border-color:var(--err);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:22px;padding-top:14px}
.act{border:none;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(23,19,15,.14)}
.act.no{width:64px;height:64px;background:var(--n50);color:var(--err);border:1.5px solid var(--n200)}
.act.yes{width:72px;height:72px;background:var(--m500);color:var(--n950)}
.act.undo{width:48px;height:48px;background:var(--n100);color:var(--n800)}
.act svg{width:28px;height:28px}
.pchip{min-height:40px;padding:0 14px;border-radius:999px;border:none;background:var(--n100);font-size:14px;color:var(--n800);display:flex;align-items:center;gap:6px}
/* grid */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile.hasimg{background-size:cover;background-position:center;color:#FCFAF7!important}
.tile.hasimg::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(23,19,15,.8));pointer-events:none}
.tile b,.tile span{position:relative}
.tile{aspect-ratio:3/4;border-radius:12px;border:2px solid transparent;padding:6px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;position:relative;overflow:hidden;font-size:11px;line-height:1.25}
.tile b{font-weight:500;font-size:12px}
.tile[aria-pressed="true"]{border-color:var(--b700);box-shadow:0 0 0 2px var(--b700)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:999px;background:var(--b700);color:var(--n50);display:flex;align-items:center;justify-content:center;font-size:13px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sitem{border:none;background:var(--n100);border-radius:18px;padding:8px;text-align:right;display:flex;flex-direction:column;gap:6px}
.sitem .th{aspect-ratio:1;border-radius:12px;background:var(--n200);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tabs{display:flex;background:var(--n100);border-radius:999px;padding:4px}
.tab{flex:1;min-height:44px;border:none;border-radius:999px;background:transparent;font-size:15px;color:var(--n700)}
.tab[aria-selected="true"]{background:var(--n50);color:var(--n950);font-weight:500;box-shadow:0 1px 4px rgba(23,19,15,.1)}
.artist{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--n100)}
.avatar{width:48px;height:48px;border-radius:999px;background:var(--b200);color:var(--b900);font-weight:500;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fmt{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 16px;border-radius:16px;border:1.5px solid var(--n300);background:var(--n50);width:100%;font-size:15px}
.fmt[aria-pressed="true"]{border-color:var(--b700);background:var(--b100)}
.empty{text-align:center;color:var(--n700);padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
/* overlays */
.overlay{position:absolute;inset:0;background:rgba(23,19,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s ease}
.overlay.center{align-items:center;padding:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--n50);width:100%;border-radius:28px 28px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.matchbox{background:var(--m500);border-radius:30px;padding:26px 20px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;color:var(--n950);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.matchbox .pair{display:flex;align-items:center}
.matchbox .pair span{width:56px;height:56px;border-radius:999px;border:3px solid var(--n50);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;background:var(--b200);color:var(--b900)}
.matchbox .pair span+span{margin-right:-14px;background:var(--m100);color:var(--m800)}
.toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--n950);color:var(--n50);padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:90%;text-align:center;animation:fade .2s}
.welcome-art{height:250px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.welcome-art .fr{position:absolute;border-radius:12px;box-shadow:0 8px 24px rgba(23,19,15,.18);overflow:hidden;outline:4px solid var(--n50)}
.pcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--n100);border:none;width:100%;text-align:right}
.pthumb{width:56px;height:56px;border-radius:14px;background:var(--n200);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--n600)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.switch{width:52px;height:32px;border-radius:999px;border:none;background:var(--n300);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;background:var(--n50);transition:.2s}
.switch[aria-checked="true"]{background:var(--b700)}
.switch[aria-checked="true"]::after{right:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

      for(let i=0;i<5;i++)b+=`<rect y="${H*.62+i*H*.08}" width="${W}" height="${H*.08+1}" fill="${p[3]}" opacity="${.55+i*.09}"/>`;
      b+=`<rect x="14" y="${H*.48}" width="6" height="${H*.16}" fill="${p[4]}"/><rect x="22" y="${H*.52}" width="9" height="${H*.12}" fill="${p[4]}"/>`;break;
    case 'blocks':
      b+=`<rect width="${W}" height="${H}" fill="${p[0]}"/>`;
      for(let i=0;i<7;i++){const x=R()*70,y=R()*(H-25),w=15+R()*35,h=12+R()*35;b+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${p[1+i%4]}" opacity=".92"/>`}break;
    case 'arcs':
      b+=`<rect width="${W}" height="${H}" fill="${p[0]}"/>`;
      for(let i=0;i<6;i++)b+=`<circle cx="50" cy="${H}" r="${85-i*13}" fill="${p[1+i%3]}"/>`;break;
    case 'leaves':
      b+=`<rect width="${W}" height="${H}" fill="${p[0]}"/>`;

      for(let i=0;i<9;i++)b+=`<circle cx="${R()*100}" cy="${R()*H}" r="${6+R()*20}" fill="${p[1+i%4]}" opacity=".85"/>`;break;
    case 'line':
      b+=`<rect width="${W}" height="${H}" fill="${p[0]}"/><path d="M12 ${H*.7} C 30 ${H*.2}, 60 ${H*.9}, 88 ${H*.3}" stroke="${p[1]}" stroke-width="1.6" fill="none"/><circle cx="70" cy="${H*.32}" r="7" fill="${p[2]}"/>`;break;

    el.style.left=cur.u*100+'%';el.style.top=cur.v*100+'%';const gh=wall.querySelector('.gl.h'),gv=wall.querySelector('.gl.v');gh.style.top=cur.v*100+'%';gv.style.left=cur.u*100+'%';gv.style.top=(cur.v+hv)*100+'%';wf.querySelector('.hcm').textContent=Math.round((1-cur.v)*p.wallH/10)});
  const up=e=>{if(!on)return;on=false;wf.classList.remove('dragging');if(!moved){onTap&&onTap();return}p.pos=p.pos||{};p.pos[id]=cur;save()};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>{on=false;wf.classList.remove('dragging')})}
function bindDrag(){const el=document.querySelector('.showgl .art.drag');if(!el)return;bindDragEl(el);applyZoom()}
function applyZoom(){const el=document.querySelector('.showgl .art.drag');if(!el)return;const wall=el.closest('.wall');const z=S._zoom||1;wall.style.transform='';const r=wall.getBoundingClientRect(),a=el.getBoundingClientRect();wall.style.transformOrigin=((a.left+a.width/2-r.left)/r.width*100)+'% '+((a.top+a.height/2-r.top)/r.height*100)+'%';wall.style.transform=z>1?`scale(${z})`:'';wall.style.transition='transform .2s'}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;app.appendChild(t);setTimeout(()=>t.remove(),2400)}
function overlay(html,cls=''){
  closeOverlay();const o=document.createElement('div');o.className='overlay '+cls;o.id='ov';o.innerHTML=html;app.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o&&!o.dataset.lock)closeOverlay()});
  bind(o);const f=o.querySelector('button,input');if(f)f.focus({preventScroll:true});return o;
}

function buildDeck(){
  const p=proj();const tasteStyles=S.taste.map(i=>TASTE[i][4]);
  let list=ARTS.filter(a=>!p.seen.includes(a.id)&&(!MUSEUM_READY||a.museum));

  list.forEach(a=>{a._s=0;a.st.forEach(s=>{if(F&&S.styles.includes(s))a._s+=3;if(tasteStyles.includes(s))a._s+=2});if(S.mode==='together'&&PL(a))a._s+=1;a._s+=((a.id*7919)%97)/100});

  deck=list;di=0;
}

/* ---------- render ---------- */
function render(){
  closeOverlay();
  const name=cur();
  if(['wall','swipe','saved','detail'].includes(name)&&!proj()){stack=['projects'];return render()}
  app.innerHTML=`<section class="screen" data-screen="${name}">${V[name]()}</section>`;
  app.insertAdjacentHTML('beforeend','<span class="ver" aria-hidden="true">גרסה 25 · 08.11 12:11</span>');
  bind(app);
  if(name==='swipe')drawDeck();
  const sc=$('.screen');sc.scrollTop=0;fitWalls();bindCorners();bindDrag();moreHint();
  {const q=proj();if(q&&photos[q.id]&&!q.light&&q.photoR)computeLight(q,()=>{if(['swipe','detail'].includes(cur()))render()})}
  const pp=proj();if(name==='wall'&&pp&&photos[pp.id]&&!pp.photoR){const im=new Image();im.onload=()=>{pp.photoR=im.width/im.height;pp.corners=[[.15,.15],[.85,.15],[.85,.85],[.15,.85]];save();render()};im.src=photos[pp.id]}
}
function moreHint(){const sc=$('.screen');if(!sc)return;let m=$('#more');if(!m){app.insertAdjacentHTML('beforeend','<button class="more" id="more" aria-label="יש עוד למטה">יש עוד למטה ↓</button>');m=$('#more');m.onclick=()=>sc.scrollBy({top:sc.clientHeight*.7,behavior:'smooth'})}
  const upd=()=>{const left=sc.scrollHeight-sc.clientHeight-sc.scrollTop;m.hidden=!(left>40)};upd();sc.addEventListener('scroll',upd,{passive:true});setTimeout(upd,400)}
function fitWalls(){document.querySelectorAll('.wallfit').forEach(f=>{const w=f.querySelector('.wall');const r=+w.dataset.r;const W=f.clientWidth,H=f.clientHeight;if(!W||!H)return;let ww=W,hh=W/r;if(hh>H){hh=H;ww=H*r}w.style.width=ww+'px';w.style.height=hh+'px'});applyPlanes()}
function homog(c,W,H){const [x0,y0]=c[0],[x1,y1]=c[1],[x2,y2]=c[2],[x3,y3]=c[3];const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;let a,b,cc,d,e,f,g=0,h=0;if(Math.abs(dx3)<1e-9&&Math.abs(dy3)<1e-9){a=x1-x0;b=x3-x0;cc=x0;d=y1-y0;e=y3-y0;f=y0}else{const den=dx1*dy2-dx2*dy1;g=(dx3*dy2-dx2*dy3)/den;h=(dx1*dy3-dx3*dy1)/den;a=x1-x0+g*x1;b=x3-x0+h*x3;cc=x0;d=y1-y0+g*y1;e=y3-y0+h*y3;f=y0}return `matrix3d(${a/W},${d/W},0,${g/W},${b/H},${e/H},0,${h/H},0,0,1,0,${cc},${f},0,1)`}
function applyPlanes(){document.querySelectorAll('.plane').forEach(pl=>{const W=pl.parentElement.clientWidth,H=pl.parentElement.clientHeight;if(!W||!H)return;const c=JSON.parse(pl.dataset.c).map(([u,v])=>[u*W,v*H]);pl.style.transform=homog(c,W,H)})}
window.addEventListener('resize',()=>{if(cur()==='swipe')drawDeck();else fitWalls()});
function bind(root){
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>A[b.dataset.act]&&A[b.dataset.act](b,e));
  root.querySelectorAll('[data-group]').forEach(g=>g.querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{
    g.querySelectorAll('[data-val]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const k=g.dataset.group,v=b.dataset.val;
    if(k==='fp')S._firstProj=v;
    if(k==='mode'){S.mode=v;const iv=$('#invite');if(iv)iv.hidden=v!=='together';save()}
    if(k==='orient'){S.orient=v;save()}
    if(k==='fmt'){S._fmt=v;const y=$('.screen').scrollTop;render();$('.screen').scrollTop=y}
  }));
  root.querySelectorAll('[data-multi]').forEach(g=>g.querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.val,i=S.styles.indexOf(v);if(i>=0)S.styles.splice(i,1);else S.styles.push(v);b.setAttribute('aria-pressed',i<0);save();
  }));
  root.querySelectorAll('[data-size]').forEach(el=>el.onchange=()=>{const p=proj();const v=Math.round(parseFloat(el.value.replace(/[^\d.]/g,''))*10);p.size=p.size||{};p.size[el.dataset.size]=v>0?v:null;el.value=p.size[el.dataset.size]?CM(p.size[el.dataset.size]):'';save()});
  const pm=root.querySelector('#pm');if(pm)pm.oninput=()=>{S.priceMax=+pm.value;$('#pmv').textContent='₪'+pm.value;save()};
  root.querySelectorAll('[data-photo]').forEach(inp=>inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)loadPhoto(f)});
  ['ww','wh'].forEach(id=>{const el=root.querySelector('#'+id);if(el)el.onchange=()=>{const p=proj();const v=Math.round(parseFloat(el.value.replace(/[^\d.]/g,''))*10);if(v>=300&&v<=20000){if(id==='ww')p.wallW=v;else p.wallH=v;save();refreshSize(p);const cm=$('.cmark');if(cm){const c=defCenter(p);cm.style.left=c.u*100+'%';cm.style.top=c.v*100+'%';$('#ccm').textContent=Math.round((1-c.v)*p.wallH/10)}}else{toast('מזינים מספר בין 30 ל-2000 ס״מ');el.value=CM(id==='ww'?p.wallW:p.wallH)}}});
}

function cornerEditor(p){const c=p.corners;return `<div class="wallfit" style="height:40vh;overflow:visible;background:transparent"><div class="wall cedit" data-r="${p.photoR}" id="cedit"><img class="photo" src="${photos[p.id]}" style="object-fit:fill" alt="הקיר שלך"><svg class="cpoly" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="cpg" points="${c.map(x=>x[0]*100+','+x[1]*100).join(' ')}" fill="rgba(43,194,172,.18)" stroke="#2BC2AC" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="plane" data-c='${JSON.stringify(c)}'><span class="cmark" style="left:${defCenter(p).u*100}%;top:${defCenter(p).v*100}%" aria-label="מרכז היצירה"></span></div>${c.map((x,i)=>`<span class="handle" data-i="${i}" aria-label="פינה ${i+1}" style="left:${x[0]*100}%;top:${x[1]*100}%"></span>`).join('')}</div></div>`}
function loupe(box,u,v){let L=box.querySelector('.loupe');const p=proj();if(!L){L=document.createElement('div');L.className='loupe';L.setAttribute('aria-hidden','true');box.appendChild(L)}
  L.hidden=false;const W=box.offsetWidth,H=box.offsetHeight,z=3,R=58;const x=u*W,y=v*H;
  let lx=x-R,ly=y-R-95;if(ly<-R)ly=y+40;lx=Math.min(W-R,Math.max(-R,lx));
  L.style.left=lx+'px';L.style.top=ly+'px';L.style.backgroundImage=`url(${photos[p.id]})`;L.style.backgroundSize=`${W*z}px ${H*z}px`;L.style.backgroundPosition=`${-(x*z-R)}px ${-(y*z-R)}px`}
function bindCorners(){const box=$('#cedit');if(!box)return;const p=proj();
  box.querySelectorAll('.handle').forEach(hd=>{let on=false;
    hd.addEventListener('pointerdown',e=>{on=true;hd.setPointerCapture(e.pointerId);e.preventDefault();const i=+hd.dataset.i;loupe(box,p.corners[i][0],p.corners[i][1])});
    hd.addEventListener('pointermove',e=>{if(!on)return;const r=box.getBoundingClientRect();const u=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),v=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));const i=+hd.dataset.i;p.corners[i]=[u,v];loupe(box,u,v);hd.style.left=u*100+'%';hd.style.top=v*100+'%';$('#cpg').setAttribute('points',p.corners.map(x=>x[0]*100+','+x[1]*100).join(' '))});
    const up=()=>{const L=box.querySelector('.loupe');if(L)L.hidden=true;if(on){on=false;save();computeLight(p);box.querySelector('.plane').dataset.c=JSON.stringify(p.corners);applyPlanes()}};hd.addEventListener('pointerup',up);hd.addEventListener('pointercancel',up)});
  const cm=box.querySelector('.cmark');let on=false;
  cm.addEventListener('pointerdown',e=>{on=true;cm.setPointerCapture(e.pointerId);e.preventDefault()});
  cm.addEventListener('pointermove',e=>{if(!on)return;const q=screenToWall(box,e);const c={u:Math.min(.95,Math.max(.05,q.u)),v:Math.min(.95,Math.max(.05,q.v))};p.center=c;cm.style.left=c.u*100+'%';cm.style.top=c.v*100+'%';const t=$('#ccm');if(t)t.textContent=Math.round((1-c.v)*p.wallH/10)});
  const cup=()=>{if(on){on=false;p.pos={};save()}};cm.addEventListener('pointerup',cup);cm.addEventListener('pointercancel',cup)}

/* ---------- automatic wall detection (experimental) ---------- */
function wallQuads(m){const w=m.width,h=m.height,ch=m.channels||1,d=m.data;const GW=120,GH=Math.max(10,Math.round(120*h/w));const g=new Uint8Array(GW*GH);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const sx=Math.min(w-1,Math.floor((x+.5)*w/GW)),sy=Math.min(h-1,Math.floor((y+.5)*h/GH));g[y*GW+x]=d[(sy*w+sx)*ch]>127?1:0}
  const lab=new Int32Array(GW*GH).fill(-1);const comps=[];
  for(let i=0;i<GW*GH;i++){if(!g[i]||lab[i]>=0)continue;const id=comps.length,pts=[];const st=[i];lab[i]=id;while(st.length){const k=st.pop();pts.push(k);const x=k%GW,y=(k-x)/GW;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)return;const n=ny*GW+nx;if(g[n]&&lab[n]<0){lab[n]=id;st.push(n)}})}comps.push(pts)}
  const regions=[];comps.filter(c=>c.length>GW*GH*.04).forEach(c=>{const P=c.map(k=>[k%GW,Math.floor(k/GW)]);splitRegion(P).forEach(r=>{if(r.length>GW*GH*.03)regions.push(r)})});
  regions.sort((a,b)=>b.length-a.length);
  return regions.slice(0,3).map(P=>{let tl=P[0],tr=P[0],br=P[0],bl=P[0];P.forEach(q=>{if(q[0]+q[1]<tl[0]+tl[1])tl=q;if(q[0]-q[1]>tr[0]-tr[1])tr=q;if(q[0]+q[1]>br[0]+br[1])br=q;if(q[1]-q[0]>bl[1]-bl[0])bl=q});
    return [tl,[tr[0]+1,tr[1]],[br[0]+1,br[1]+1],[bl[0],bl[1]+1]].map(([x,y])=>[Math.min(1,x/GW),Math.min(1,y/GH)])})}
function splitRegion(P){const top={};P.forEach(([x,y])=>{if(top[x]===undefined||y<top[x])top[x]=y});const xs=Object.keys(top).map(Number).sort((a,b)=>a-b);if(xs.length<16)return [P];
  const fit=a=>{const n=a.length;let sx=0,sy=0,sxx=0,sxy=0;a.forEach(x=>{const y=top[x];sx+=x;sy+=y;sxx+=x*x;sxy+=x*y});const den=n*sxx-sx*sx||1;const m=(n*sxy-sx*sy)/den,b=(sy-m*sx)/n;let e=0;a.forEach(x=>{const r=top[x]-(m*x+b);e+=r*r});return {m,e}};
  const all=fit(xs);let best=null;for(let i=Math.floor(xs.length*.15);i<Math.ceil(xs.length*.85);i++){const L=fit(xs.slice(0,i+1)),R=fit(xs.slice(i));const e=L.e+R.e;if(!best||e<best.e)best={e,i,L,R}}
  if(best&&best.e<all.e*.35&&Math.abs(best.L.m-best.R.m)>.12){const cx=xs[best.i];return [P.filter(q=>q[0]<=cx),P.filter(q=>q[0]>cx)]}return [P]}
window.__wallQuads=wallQuads;window.__buildOcc=buildOccluders;window.__proj=()=>proj();
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.wall,.handle,.cmark,.scard'))e.preventDefault()});
const OCC=/lamp|chair|sofa|couch|table|desk|plant|flower|vase|person|cushion|pillow|bed|cabinet|shelf|bookcase|television|monitor|screen|computer|fan|box|bottle|stool|bench|light|chandelier|sconce|curtain|blind|pot|basket|clock|book|toy|radiator|heater|plaything|chest|wardrobe|counter|ottoman|pouf|stand|kitchen island|car|bicycle|animal|dog|cat/i;
const NOTOCC=/wall|floor|ceiling|window|door|painting|picture|mirror|sky|building|rug|carpet/i;
async function buildOccluders(p,out){const segs=out.filter(o=>OCC.test(o.label)&&!NOTOCC.test(o.label));p.occ=null;p.occLabels=null;if(!segs.length)return;
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=photos[p.id]});const W=im.width,H=im.height;
  const mc=document.createElement('canvas');mc.width=W;mc.height=H;const mx=mc.getContext('2d');const md=mx.createImageData(W,H);
  segs.forEach(o=>{const m=o.mask,ch=m.channels||1;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const sx=Math.min(m.width-1,Math.floor(x*m.width/W)),sy=Math.min(m.height-1,Math.floor(y*m.height/H));if(m.data[(sy*m.width+sx)*ch]>127)md.data[(y*W+x)*4+3]=255}});
  mx.putImageData(md,0,0);
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;const ox=oc.getContext('2d');ox.drawImage(im,0,0);ox.globalCompositeOperation='destination-in';
  try{ox.filter='blur(1.5px)'}catch(e){}ox.drawImage(mc,0,0);
  p.occ=oc.toDataURL('image/png');p.occLabels=[...new Set(segs.map(o=>HE[o.label.trim()]||o.label.trim()))].slice(0,6);save()}
const HE={lamp:'מנורה',chair:'כיסא',sofa:'ספה',armchair:'כורסה','swivel chair':'כיסא',table:'שולחן','coffee table':'שולחן קפה',desk:'שולחן עבודה',plant:'צמח',flower:'פרחים',vase:'אגרטל',person:'אדם',cushion:'כרית',pillow:'כרית',bed:'מיטה',cabinet:'ארון',shelf:'מדף',bookcase:'כוננית','television receiver':'טלוויזיה',fan:'מאוורר',box:'קופסה',bottle:'בקבוק',stool:'שרפרף',bench:'ספסל',light:'תאורה',chandelier:'נברשת',sconce:'מנורת קיר',curtain:'וילון',blind:'תריס',pot:'עציץ',basket:'סל',clock:'שעון',book:'ספרים',radiator:'רדיאטור',ottoman:'הדום',wardrobe:'ארון בגדים','chest of drawers':'שידה'};
async function detectWalls(){const p=proj();if(!photos[p.id])return;
  const o=overlay(`<div class="sheet" role="dialog" aria-label="זיהוי קיר"><h2>מזהים את הקיר…</h2><p class="sub" style="margin:0" id="dprog">בפעם הראשונה נטען מודל זיהוי (כמה מגה). אחר כך זה מהיר.</p></div>`);o.dataset.lock=1;
  try{const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');T.env.allowLocalModels=false;
    if(!window._seg)window._seg=await T.pipeline('image-segmentation','Xenova/segformer-b0-finetuned-ade-512-512',{progress_callback:x=>{const el=$('#dprog');if(el&&x.status==='progress'&&x.progress)el.textContent='טוען מודל זיהוי… '+Math.round(x.progress)+'%'}});
    const el=$('#dprog');if(el)el.textContent='מנתחים את התמונה…';
    const out=await window._seg(photos[p.id]);try{await buildOccluders(p,out)}catch(e){}const wall=out.find(r=>/wall/i.test(r.label));
    if(!wall)throw new Error('nowall');const quads=wallQuads(wall.mask);if(!quads.length)throw new Error('nowall');
    window._quads=quads;
    if(quads.length===1){A.pickWall({dataset:{i:0}});return}
    const cols=['#2BC2AC','#CD7A4D','#2F6E9E'];
    overlay(`<div class="sheet" role="dialog" aria-label="בחירת קיר"><h2>זיהינו ${quads.length} קירות. איזה מהם?</h2>
     <div style="position:relative;border-radius:14px;overflow:hidden"><img src="${photos[p.id]}" style="display:block;width:100%" alt="הקיר שלך"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${quads.map((q,i)=>`<polygon points="${q.map(c=>c[0]*100+','+c[1]*100).join(' ')}" fill="${cols[i]}33" stroke="${cols[i]}" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="${q.reduce((a,c)=>a+c[0],0)*25}" y="${q.reduce((a,c)=>a+c[1],0)*25}" font-size="9" font-weight="700" fill="#fff" stroke="#17130F" stroke-width=".4" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`).join('')}</svg></div>
     <div class="row" style="gap:8px">${quads.map((q,i)=>`<button class="btn" style="background:${cols[i]};color:#17130F" data-act="pickWall" data-i="${i}">קיר ${i+1}</button>`).join('')}</div>
     <button class="btn soft" data-act="close">ביטול, אסמן לבד</button></div>`);
  }catch(e){overlay(`<div class="sheet" role="dialog"><h2>לא הצלחנו לזהות קיר אוטומטית</h2><p class="sub" style="margin:0">${e&&e.message==='nowall'?'לא נמצא קיר ברור בתמונה. אפשר לסמן את הפינות ידנית.':'לא הצלחנו לטעון את מודל הזיהוי (צריך חיבור לאינטרנט, ובדמו בתוך Claude זה חסום). אפשר לסמן את הפינות ידנית.'}</p><button class="btn" data-act="close">סימון ידני</button></div>`)}}

/* ---------- photo ---------- */
function loadPhoto(file){
  const p=proj();toast('טוען את התמונה…');
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{
    const max=1100,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let d;try{d=c.toDataURL('image/jpeg',.78)}catch(e){d=url}
    photos[p.id]=d;p.photo=d;p.occ=null;p.occLabels=null;p.photoR=c.width/c.height;p.corners=[[.15,.15],[.85,.15],[.85,.85],[.15,.85]];save();URL.revokeObjectURL(url);render();computeLight(p);toast('עכשיו גוררים את 4 העיגולים לפינות הקיר');
  };
  img.onerror=()=>toast('לא הצלחנו לפתוח את הקובץ. נסו תמונה אחרת');
  img.src=url;
}

/* ---------- swipe ---------- */
function cardHTML(a,cls){const p=proj();return `<div class="scard ${cls}" data-id="${a.id}">
  <span class="stamp like">אהבתי</span><span class="stamp nope">לא בשבילי</span>
  ${S.view==='art'?`<div class="artonly"><div class="aframe" style="aspect-ratio:${a.w}/${a.h}">${svgArt(a)}</div><span class="dims">${D(a.w,a.h)} ס״מ</span></div>`:wallHTML(p,a,null,{fill:true,drag:cls==='front'})}
  <div class="meta"><div style="min-width:0"><b style="font-weight:500;font-size:18px;display:block">${a.t}</b><span style="font-size:14px;color:var(--n700)">${AR(a).name} · ${D(a.w,a.h)} ס״מ</span></div><span style="font-weight:500;color:var(--b800);white-space:nowrap">מ-₪${minPrice(a)}</span></div>
 </div>`}
function drawDeck(){
  const el=$('#deck');if(!el)return;
  const a=deck[di],n=deck[di+1];
  if(!a){const p=proj();const rest=ARTS.filter(x=>!p.likes.includes(x.id));if(rest.length&&deck.length){p.seen=p.likes.slice();save();buildDeck();if(deck.length){toast('סבב נוסף: היצירות שדילגת עליהן');return drawDeck()}}
    el.innerHTML=`<div class="empty" style="height:100%;justify-content:center"><h2>אין כרגע יצירות שמתאימות</h2><span>אפשר להרחיב את הסינון או להתחיל מחדש.</span><button class="btn" style="width:auto" data-act="restartDeck">להתחיל מחדש</button><button class="link" data-go="taste">לשנות סינון</button></div>`;bind(el);return}
  el.innerHTML=(n?cardHTML(n,'back'):'')+cardHTML(a,'front');
  if(S.view==='art')el.querySelectorAll('.scard').forEach(cd=>{cd.style.bottom='0';const bx=cd.querySelector('.artonly'),fr=cd.querySelector('.aframe');const aa=ARTS.find(x=>x.id===+cd.dataset.id);const W=bx.clientWidth-44,H=bx.clientHeight-56;const r=aa.w/aa.h;let w=W,h=W/r;if(h>H){h=H;w=H*r}fr.style.width=w+'px';fr.style.height=h+'px'});
  else el.querySelectorAll('.scard').forEach(cd=>{const wf=cd.querySelector('.wallfit');const r=+cd.querySelector('.wall').dataset.r;const mh=cd.querySelector('.meta').offsetHeight;
    const h=Math.min(el.clientHeight-mh-4,cd.clientWidth/r);wf.style.flex='none';wf.style.height=Math.max(160,h)+'px';cd.style.top=Math.max(0,(el.clientHeight-cd.offsetHeight)/2)+'px'});
  fitWalls();
  bindDragEl(el.querySelector('.front .art.drag'),()=>{S._art=a.id;S._fmt=null;S._zoom=1;go('detail')});
  const c=el.querySelector('.front');let sx=0,sy=0,dx=0,dy=0,down=false,moved=false;
  c.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;c.setPointerCapture(e.pointerId);c.style.transition='none'});
  c.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
    c.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/18}deg)`;
    c.querySelector('.like').style.opacity=Math.max(0,Math.min(1,dx/90));c.querySelector('.nope').style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(!down)return;down=false;c.style.transition='transform .25s ease';
    if(!moved){S._art=a.id;S._fmt=null;go('detail');return}
    if(dx>90)decide(true,c);else if(dx<-90)decide(false,c);else{c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',()=>{down=false;c.style.transform=''});
}
function record(a,like){const p=proj();let matched=false;
  if(!p.seen.includes(a.id))p.seen.push(a.id);
  if(like){if(!p.likes.includes(a.id))p.likes.push(a.id);rejectStreak=0;
    if(S.mode==='together'&&PL(a)&&!p.matches.includes(a.id)){p.matches.push(a.id);matched=true}}
  else rejectStreak++;
  lastAction={id:a.id,like,matched,streak:rejectStreak};save();return matched}
function detDecide(like){const a=deck[di];if(!a||a.id!==S._art)return;const matched=record(a,like);di++;
  const n=deck[di];if(n){S._art=n.id;S._fmt=null;S._zoom=1;render();$('.screen').scrollTop=0}else{back()}
  toast(like?'נשמר באהבתי ✓':'דילגנו');if(matched)showMatch(a);else if(rejectStreak>=15)showRecal()}
function decide(like,c){
  const a=deck[di];if(!a)return;const p=proj();
  c=c||$('#deck .front');
  if(c){c.style.transition='transform .3s ease';c.style.transform=`translate(${like?520:-520}px,0) rotate(${like?24:-24}deg)`;c.querySelector(like?'.like':'.nope').style.opacity=1}
  const matched=record(a,like);
  setTimeout(()=>{di++;render();
    if(matched)showMatch(a);
    else if(rejectStreak>=15)showRecal();
  },260);
}
function showMatch(a){
  overlay(`<div class="matchbox" role="dialog" aria-label="מאץ׳">
   <div class="pair"><span>${(S.name||'א')[0]}</span><span>ד</span></div>
   <h1 style="color:var(--n950)">יש מאץ׳!</h1>
   <p style="margin:0;font-size:16px">${esc(S.name||'את/ה')} ודנה אהבתם את ״${a.t}״</p>
   <div style="width:150px;aspect-ratio:${a.w}/${a.h};max-height:190px;outline:4px solid var(--n50);box-shadow:0 8px 20px rgba(0,0,0,.25)">${svgArt(a)}</div>
   <button class="btn" style="background:var(--n950)" data-act="matchView" data-id="${a.id}">לצפייה ביצירה</button>
   <button class="btn ghost" style="border-color:var(--n950)" data-act="close">להמשיך להחליף</button>
  </div>`,'center');
}
function showRecal(){
  const o=overlay(`<div class="sheet" role="dialog" aria-label="כיול מחדש">
   <h2>נראה שעוד לא מצאנו את הכיוון</h2>
   <p class="sub" style="margin:0">דילגת על ${rejectStreak} יצירות ברצף. רוצה לכוון מחדש?</p>
   <button class="btn" data-act="recalTaste">לחזור לסינון</button>
   <button class="btn soft" data-act="recalFilter">סינון לפי סגנון, כיוון ומחיר</button>
   <button class="link" data-act="recalKeep">להמשיך להחליף</button>
  </div>`);o.dataset.lock=1;
}

/* ---------- actions ---------- */
const A={
  detectWalls:()=>detectWalls(),
  pickWall:b=>{const p=proj();p.corners=window._quads[+b.dataset.i];p.pos={};save();closeOverlay();render();computeLight(p);toast('בודקים את 4 הפינות ומתקנים אם צריך')},
  noFilter:()=>{S.noFilter=!S.noFilter;save();buildDeck();rejectStreak=0;render();toast(S.noFilter?'מוצגות כל היצירות, בלי סינון':'הסינון חזר')},
  view:b=>{S.view=b.dataset.v;save();render()},
  back:()=>{let h=null;try{h=history.state}catch(e){}if(h&&h.am>1)history.back();else back()},
  lightToggle:()=>{S.lightOn=S.lightOn===false;save();const y=$('.screen').scrollTop;render();$('.screen').scrollTop=y},
  occToggle:b=>{const p=proj();p.occOn=p.occOn===false;b.setAttribute('aria-checked',p.occOn);save()},
  detLike:()=>detDecide(true),detNope:()=>detDecide(false),
  zoomIn:()=>{S._zoom=Math.min(3,(S._zoom||1)+.5);applyZoom()},
  zoomOut:()=>{S._zoom=Math.max(1,(S._zoom||1)-.5);applyZoom()},
  fullWall:()=>{S._full=!S._full;const y=$('.screen').scrollTop;render();$('.screen').scrollTop=y},
  resetCorners:()=>{const p=proj();p.corners=[[.15,.15],[.85,.15],[.85,.85],[.15,.85]];save();render()},
  close:()=>closeOverlay(),
  login:()=>{S.registered=true;save();if(!S.projects.length){toast('בדמו אין עדיין פרויקטים, פותחים ראשון');go('about')}else go('projects')},
  signup:()=>{S.registered=true;save();go('about')},
  invite:b=>{const t='https://artmatch.app/join/demo-dana';const done=()=>{b.textContent='הועתק (קישור לדוגמה)'};try{navigator.clipboard.writeText(t).then(done,done)}catch(e){done()}},
  aboutNext:()=>{const n=$('#nm').value.trim();if(!n){toast('רק שם פרטי, כדי שנדע איך לפנות');$('#nm').focus();return}
    S.name=n;const pn=S._firstProj||'סלון';
    if(!S.projects.length||S._pendingNew){S._pendingNew=false;newProject(pn)}save();go('path')},
  openProj:b=>{S.cur=+b.dataset.id;save();go('wall')},
  delProj:b=>{const p=S.projects.find(x=>x.id===+b.dataset.id);
    overlay(`<div class="sheet" role="dialog"><h2>למחוק את ״${esc(p.name)}״?</h2><p class="sub" style="margin:0">היצירות שסימנת והתמונה של הקיר יימחקו מהטלפון. אי אפשר לשחזר.</p><button class="btn" style="background:var(--err)" data-act="delYes" data-id="${p.id}">כן, למחוק</button><button class="btn soft" data-act="close">ביטול</button></div>`)},
  delYes:b=>{const id=+b.dataset.id;S.projects=S.projects.filter(x=>x.id!==id);delete photos[id];if(S.cur===id)S.cur=null;save();render();toast('הפרויקט נמחק')},
  newProj:()=>{overlay(`<div class="sheet" role="dialog" aria-label="פרויקט חדש"><h2>פרויקט חדש</h2><p class="sub" style="margin:0">לאיזה קיר?</p>
    <div class="chips" data-np>${['סלון','חדר שינה','פינת אוכל','מסדרון','חדר עבודה'].map(x=>`<button class="chip" data-np-v="${x}">${x}</button>`).join('')}</div>
    <div class="field"><label for="npn">או שם משלך</label><input id="npn" class="input" placeholder="למשל: הקיר מעל הספה"></div>
    <button class="btn" data-act="npCreate">יצירה</button></div>`);
    document.querySelectorAll('[data-np-v]').forEach(c=>c.onclick=()=>{$('#npn').value=c.dataset.npV;document.querySelectorAll('[data-np-v]').forEach(x=>x.setAttribute('aria-pressed',x===c))});},
  npCreate:()=>{const n=$('#npn').value.trim();if(!n){toast('בוחרים קיר או כותבים שם');return}newProject(n);closeOverlay();go('path')},
  resetDemo:()=>{overlay(`<div class="sheet" role="dialog"><h2>לאפס את הדמו?</h2><p class="sub" style="margin:0">כל מה ששמרת בטלפון הזה יימחק, ונחזור למסך הפתיחה.</p><button class="btn" data-act="resetYes">כן, לאפס</button><button class="btn soft" data-act="close">ביטול</button></div>`)},
  resetYes:()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()},
  skipPath:()=>{S.styles=[];S.taste=[];save();go('wall')},
  sizeToggle:b=>{const p=proj();p.size=p.size||{};const on=!sizeRule(p).on;p.size.on=on;b.setAttribute('aria-checked',on);$('#sizebox').hidden=!on;save()},
  sizeAuto:()=>{const p=proj();p.size={on:true};save();refreshSize(p)},
  priceToggle:b=>{S.priceOn=!S.priceOn;b.setAttribute('aria-checked',S.priceOn);$('#pricebox').hidden=!S.priceOn;save()},
  taste:b=>{const i=+b.dataset.i,k=S.taste.indexOf(i);
    if(k>=0)S.taste.splice(k,1);else S.taste.push(i);
    b.setAttribute('aria-pressed',k<0);$('#tcount').textContent='נבחרו '+S.taste.length;const n=$('#tnext');n.disabled=S.taste.length<3;n.textContent=S.taste.length>=3?'המשך':'עוד '+(3-S.taste.length)+' לפחות';save()},
  toWall:()=>{const p=proj();if(p)p.seen=[];save();if(stack.includes('swipe')){buildDeck();rejectStreak=0;stack=stack.slice(0,stack.indexOf('swipe')+1);render()}else go('wall')},
  startSwipe:()=>{const ww=$('#ww'),wh=$('#wh');const p=proj();
    const a=Math.round(parseFloat(ww.value)*10),b=Math.round(parseFloat(wh.value)*10);if(!(a>=300&&b>=300)){toast('צריך רוחב וגובה בס״מ');return}p.wallW=a;p.wallH=b;save();
    buildDeck();rejectStreak=0;go('swipe')},
  like:()=>decide(true),nope:()=>decide(false),
  undo:()=>{if(!lastAction||di===0){toast('אין מה לבטל');return}const p=proj();const l=lastAction;
    di--;p.seen=p.seen.filter(x=>x!==l.id);if(l.like){p.likes=p.likes.filter(x=>x!==l.id);if(l.matched)p.matches=p.matches.filter(x=>x!==l.id)}else rejectStreak=Math.max(0,rejectStreak-1);
    lastAction=null;save();render();toast('בוטל')},
  saved:b=>{S._tab=b.dataset.tab;go('saved')},
  tab:b=>{S._tab=b.dataset.tab;render()},
  backSwipe:()=>{if(stack.includes('swipe')){stack=stack.slice(0,stack.indexOf('swipe')+1);render()}else{buildDeck();go('swipe')}},
  detail:b=>{S._art=+b.dataset.id;S._fmt=null;S._zoom=1;go('detail')},
  matchView:b=>{closeOverlay();S._art=+b.dataset.id;S._fmt=null;go('detail')},
  restartDeck:()=>{proj().seen=[];save();buildDeck();render()},
  recalFilter:()=>{rejectStreak=0;closeOverlay();go('filter')},
  recalTaste:()=>{rejectStreak=0;closeOverlay();go('taste')},
  recalKeep:()=>{rejectStreak=0;closeOverlay()},
  toggleLike:()=>{const p=proj(),id=S._art;if(p.likes.includes(id)){p.likes=p.likes.filter(x=>x!==id);p.matches=p.matches.filter(x=>x!==id);toast('הוסר מאהבתי')}else{p.likes.push(id);if(S.mode==='together'&&PL(ARTS.find(a=>a.id===id))&&!p.matches.includes(id)){p.matches.push(id);save();render();showMatch(ARTS.find(a=>a.id===id));return}toast('נשמר באהבתי')}save();render()},
  ext:b=>{overlay(`<div class="sheet" role="dialog"><h2>${esc(b.dataset.v)}</h2><p class="sub" style="margin:0">באפליקציה האמיתית הכפתור פותח את הקישור של האמן. בדמו האמנים בדויים, אז אין לאן לעבור.</p><button class="btn soft" data-act="close">הבנתי</button></div>`)},
  contact:()=>{const a=ARTS.find(x=>x.id===S._art),ar=AR(a);const f=S._fmt||'A3';const fl=f==='orig'?'היצירה המקורית':'הדפס '+f;
    overlay(`<div class="sheet" role="dialog" aria-label="פנייה לאמן"><h2>פנייה ל${ar.name}</h2>
     <div class="artist" style="padding:10px"><span style="width:44px;aspect-ratio:${a.w}/${a.h};max-height:56px;display:block">${svgArt(a)}</span><span><b style="font-weight:500">${a.t}</b><div style="font-size:13px;color:var(--n700)">${fl}</div></span></div>
     <div class="field"><label for="msg">הודעה (לא חובה)</label><textarea id="msg" class="input" style="height:96px;padding:12px 14px;line-height:1.5">היי, ראיתי את ״${a.t}״ ב-ArtMatch ואשמח לפרטים על ${fl}.</textarea></div>
     <p class="note" style="text-align:right;margin:0">${ar.name.split(' ')[0]} תקבל את הפנייה ותחזור אליך. הפרטים שלך נחשפים רק כשהיא פותחת את הפנייה.</p>
     <button class="btn" data-act="contactSend">שליחת הפנייה</button><button class="btn soft" data-act="close">ביטול</button></div>`)},
  contactSend:()=>{const a=ARTS.find(x=>x.id===S._art),ar=AR(a);
    overlay(`<div class="sheet" role="dialog" style="align-items:center;text-align:center"><div style="width:64px;height:64px;border-radius:999px;background:var(--m100);color:var(--m700);display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
     <h2>זה היה הרגע של הפנייה</h2><p class="sub" style="margin:0">בדמו שום דבר לא נשלח. באפליקציה האמיתית ${ar.name} מקבלת את הפנייה בפורטל האמנים, ויורד לה קרדיט רק כשהיא פותחת את פרטי הקשר.</p>
     <button class="btn" data-act="close">סגירה</button></div>`)}
};

/* ---------- start ---------- */
if(S.registered&&S.projects.length)stack=['welcome','projects'];else stack=['welcome'];
try{history.replaceState({am:stack.length},'')}catch(e){}
render();
})();
</script>
</body></html>
